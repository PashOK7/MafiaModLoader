;; dxwrapper for Mafia (MafiaModLoader's build, third_party/dxwrapper/patch.py): the game's Direct3D 8 runs on
;; Direct3D 9Ex, its textures filtered anisotropically (the game asks for trilinear filtering alone: a road or a wall seen
;; at a grazing angle went blurry a few metres away). Every other setting keeps its default (dxwrapper's
;; AllSettings.ini lists them).
[Compatibility]
D3d8to9                    = 1
D3d9to9Ex                  = 1

[d3d9]
;; 1: the GPU's highest (16x); every linear filter the game sets made anisotropic
AnisotropicFiltering       = 1
