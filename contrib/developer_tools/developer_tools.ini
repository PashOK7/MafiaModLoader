; developer_tools.asi - shows script triggers in-game (Mafia 1.2, Game.exe 1.2)
; Install: developer_tools.asi + developer_tools.ini next to Game.exe (needs an ASI loader).
; Log: developer_tools.log next to the .asi.
[DeveloperTools]
Enabled=1
Log=1
ShowOnStart=1
; all settings are in the ESC game menu -> "Developer tools" (tables\menu\devtools.mnu).

; what to draw
; detector_inrange xx, radius  -> sphere around the detector (magenta, red when someone is inside)
ShowInrange=1
; getactorsdist + iftlinrange    -> line between the two actors + threshold sphere (yellow, orange when met)
ShowActorsDist=1
; trigger volumes of detectors (DUNB frames from the scene) -> box / sphere (pink, dimmed when switched off)
ShowVolumes=1
; name of the script (its actor / detector frame) above each label
ShowName=1
ShowLabels=1
; getactorsdist: line between the two actors (while that part of the script is running)
ShowLines=1
; 1 = only the trigger the script is waiting on right now; 0 = also the others of that script, dimmed
; scripts that have not run for KeepMs milliseconds are not drawn
OnlyActive=0
KeepMs=10000
; opacity of the sphere fill (0 = wireframe only)
FillAlpha=0.15
; small status text top-left
Hud=1

; only draw things closer than this (metres)
MaxDistance=150
Segments=32
LineWidth=2.0
TextScale=1.4

; 0 = take projection from the D3D device (default), 1 = camera fallback with FovDeg
; 1 = set own alpha blending / no alpha test / no z-test while drawing (needed for fill + dim rings)
OwnRenderStates=1
Projection=0
FovDeg=60
; 1 = take the projection from the game camera (exact, follows FOV changes); FovDeg is then only a fallback
UseCameraMatrix=1
; camera FOV in degrees (40 - 130), 0 = leave the game's own FOV
CameraFov=0

; colours AARRGGBB
ColorInrange=0xFF00E0FF
ColorInrangeHit=0xFFFF3030
ColorDist=0xFFFFD000
ColorDistHit=0xFFFF6000
ColorVolume=0xFFFF40FF

; --- static collision (tree.klz) ---
; 1 = show collisions right from the start
; 1 = English texts of the Developer Tools menu (tables\devtools_en.def)
LanguageEN=0
; 1 = hide the game HUD and our texts (the menus and the sun glare stay)
HideHud=0
; check.bin: walking web of the people (green/violet/orange/cyan points by category, lines = connections, red = one way)
ShowCheck=0
; road.bin: road network (red rings = crossings, blue = road nodes)
ShowRoad=0
ShowCollision=0
; only geometry within this many metres of the camera is drawn
CollisionDistance=1000
; opacity of the triangle fill (0 = edges only)
CollisionFillAlpha=0
; 1 = draw the outline edges (seams between flat faces of one wall/floor are hidden)
CollisionWire=1
; outline thickness (0.3 - 6)
CollisionLineWidth=1.0
; 1 = only what you can see (hidden behind walls via the game's depth buffer), 0 = see through walls
CollisionDepthTest=1
; metres the outline is pulled toward the camera so lines lying on a wall are not hidden by it
CollisionDepthBias=0.03
; 1 = skip faces turned away from the camera (stops the far side of thin walls showing through)
CollisionCullBack=1
; 1 = labels with the type + material of boxes/spheres/cylinders within 15 m, and the face under the
;     screen centre is highlighted with its material and distance
; 1 = material names on the collision faces around you
CollisionLabels=0
; 1 = every collision through walls and ground (no depth test)
CollisionSeeThrough=0
; 1 = also draw boxes / spheres / cylinders from the collision file
CollisionPrimitives=1
ColorCollision=0xFF30C0FF
ColorCollisionEdge=0xFF40E8FF
ColorCollisionPrim=0xC0FFA020

; --- names of all objects (cars, doors, people, ...) ---
ShowAllObjects=0
; panel with the texts of the script command debug_text "..." (settings in [DebugText] / [DebugTextPanel] below)
ShowDebugText=1
; labels shrink with distance like the object: TextScale size at LabelDistance metres (0 = always the same size on screen)
LabelDistance=6
; limits of that scaling (relative to TextScale): far away / close up
LabelMinScale=0.4
LabelMaxScale=1.4
; 1 = flying (menu 'Létání'): W/S where the camera looks, A/D sideways, SPACE up, CTRL down, SHIFT fast
Flying=0
; 1 = the player takes no damage (bullets, shotgun, explosions, cars)
GodMode=1
; 1 = the magazine of the weapon in hand never empties (no reloading)
InfiniteAmmo=1
AllObjectsDistance=40
ColorAllObjects=0xFFB0E0FF

[DebugText]
; 1 = write developer_tools_DebugText.log next to the .asi
Log=1
; also write every shown debug_text line into the log
LogLines=1

[DebugTextPanel]
; position and size in the game's virtual 800x600 coordinates (scaled to your resolution)
; X = left edge, Y = top of the panel (200 = a bit above the middle, the panel grows down)
X=15
Y=200
; max width of a line - longer lines wrap onto the next row
Width=380
; font (any installed Windows font) and its size (virtual units, 12 = small, 16 = medium)
Font=Segoe UI
TextSize=12
Bold=0
; black box behind each line: 0 = none, 1 = fully black
Background=0.6
; space between the text and the edge of the black box
Padding=3
; how many rows are visible at once (older ones scroll out)
MaxLines=9
; how long a line stays (ms), then it fades out over FadeMs; ShowMs=0 = stays until pushed out
ShowMs=3000
FadeMs=1000
; text colour 0xRRGGBB
Colour=0xFFFFFF
; code page of the texts in the scripts (1250 = Czech/central European)
CodePage=1250

[Tools]
; free camera (menu 'Free kamera'): start speed (mouse wheel changes it) and mouse sensitivity
FreecamSpeed=10
MouseSensitivity=0.15
; 1 = the engine renders from the free camera (the city streams around it)
EngineCamera=1
; 1 = keep textures in wireframe
WireTextures=0
